handover:
  id: FORTYGUARD-HACKATHON-26-HANDOVER
  date: 2026-08-24
  status: GATE_2_PROBE_READY_REAL_API_EXECUTION_BLOCKED

  read_first:
    - CANONICAL-STATE.yaml
    - decisions/CHECKPOINT-3-ARCHITECTURE-SPONSOR-CAUSALITY-PROOF-PATH.yaml
    - probe/README.md
    - probe/thermal_causality_probe.py
    - decisions/CHECKPOINT-2-CONCEPT-SELECTION.yaml

  repository:
    requested: Faadil1/fortyguard-temperature-ai-2026
    active_accessible: Faadil1/Faadil1-fortyguard-temperature-ai-2026
    branch: main
    mismatch: UNRESOLVED_REQUESTED_REPO_404

  non_negotiables:
    - actual product stays out of Faadil1/pbpd-cowork-system
    - PBPD 0.5.0 is primary build system
    - I23 remains shadow challenger only
    - stable PBPD not mutated
    - I23 runtime not integrated
    - one real product only
    - human final authority
    - no default Frankenstein merge
    - Cowork still not involved
    - no API key committed or pasted into repository

  locked_problem_job:
    id: EV_CHARGING_NETWORK_THERMAL_CAPACITY_AND_DERATING_OPERATIONS
    human_decision: GO
    fallback_problem: DISTRIBUTION_GRID_TRANSFORMER_THERMAL_HEADROOM_AND_ASSET_OPERATIONS

  locked_concept:
    id: THERMAL_CAPACITY_DISPATCH_JOB_SCHEDULER
    human_decision: GO
    core_claim: >-
      Hyperlocal ambient temperature changes expected usable charger capacity under a declared equipment-specific derating curve, which
      can change feasible charging-site/time assignments.

  gate_2:
    status: CORE_ARCHITECTURE_AND_KILL_PROBE_READY
    stable_architecture: BOUNDED_DETERMINISTIC_THERMAL_DISPATCH_PIPELINE_WITH_KILL_PROBE_FIRST
    architecture_components:
      - raw FortyGuard evidence/activity capture
      - AFDC/NLR real EV site coordinates
      - explicit scenario equipment profile
      - thermal cell mapping
      - deterministic expected-capacity engine
      - uniform/external weather baselines
      - deterministic job sensitivity/scheduler
      - decision-delta report

  first_probe:
    code: probe/thermal_causality_probe.py
    runbook: probe/README.md
    cluster: Phoenix_AZ
    date: 2024-07-05
    candidate_hours: [14:00, 15:00, 16:00]
    max_TCM_calls: 3
    equipment_profile: ABB_TERRA_184_HEAVY_DUTY_SCENARIO
    same_profile_across_sites: true
    real_station_source: DOE_AFDC_NLR
    AFDC_domain: developer.nlr.gov
    real_execution: BLOCKED_MISSING_FORTYGUARD_API_KEY_IN_AVAILABLE_RUNTIME
    fixture_mode: PIPELINE_TEST_ONLY_NOT_SPONSOR_EVIDENCE

  proof_logic:
    P1: real schema and temperature unit must be attested without numeric guessing
    P2: prefer at least two sites in different documented derating bands
    P4: predeclared one-hour job sensitivity must show a non-tie feasible-site-set change for strong pass
    fail_action: STOP_DEEP_BUILD_AND_RECONSIDER_PRESERVED_ALTERNATIVES

  evidence_boundaries:
    expected_capacity_is_derived_not_observed: true
    AFDC_station_does_not_establish_ABB_hardware: true
    FortyGuard_heat_is_not_charger_internal_temperature: true
    no_actual_power_claim_without_telemetry: true
    no_failure_or_avoided_cost_claims: true

  FortyGuard_schema_notes:
    official_repo_unit_conflict: true
    current_client_docstring: raw_TCM_Fahrenheit
    use_case_design_spec: cached_raw_TCM_Fahrenheit_then_Celsius_conversion
    README_table_elsewhere: TCM_Celsius
    handling: preserve_raw_and_schema_attestation_no_magnitude_guessing
    ambient_semantic_fit: strongly_supported_by_official_use_case_docs
    live_24h_shape: unresolved_do_not_assume

  checkpoint_3:
    stable_captured_first: true
    stable_recommendation: BOUNDED_DETERMINISTIC_THERMAL_DISPATCH_PIPELINE_WITH_KILL_PROBE_FIRST
    i23_recommendation: SAME_CORE_PLUS_DUAL_PROOF_MODE
    core_architecture_disagreement: false
    proof_path_material_disagreement: true
    I23_new_leverage: >-
      After historical causality passes, add a separate current/+12h prospective operating mode so judges see actionability rather than
      retrospective analytics only. Prospective weather is not a kill criterion and must not endanger submission readiness.
    preliminary_I23_grade: STRICT_IMPROVEMENT_CANDIDATE
    human_decision_on_delta: PENDING

  exact_next_gate: FORTYGUARD_GATE_2_REAL_CAUSALITY_PROBE_EXECUTION
  exact_next_action: >-
    Make FORTYGUARD_API_KEY available in a safe execution environment and run the bounded live probe. Do not paste/commit the key. Review
    the raw response and unit/schema attestation, then record PASS_STRONG / PASS_THERMAL_DIFFERENTIATION_ONLY / FAIL. Only after a pass
    should the product architecture be frozen for Cowork/build-scale execution.
