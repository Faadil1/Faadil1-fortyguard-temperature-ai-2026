checkpoint:
  id: FORTYGUARD_CHECKPOINT_3_ARCHITECTURE_SPONSOR_CAUSALITY_PROOF_PATH
  date: 2026-08-24
  concept_locked: THERMAL_CAPACITY_DISPATCH_JOB_SCHEDULER
  status: STABLE_AND_I23_RECOMMENDATIONS_COMPLETE_HUMAN_DECISION_PENDING

  stable_pbpd_0_5_0:
    captured_first: true
    recommendation: BOUNDED_DETERMINISTIC_THERMAL_DISPATCH_PIPELINE_WITH_KILL_PROBE_FIRST
    architecture:
      evidence_capture:
        role: capture_raw_FortyGuard_activity_and_result_with_query_provenance
        must_preserve: [activity_id, request_payload, raw_result, capture_timestamp, unit_attestation, schema_fingerprint]
      site_set:
        role: small_same-equipment-profile_test_cluster_before_any_network-scale_claim
        initial_cluster: PHOENIX_ARIZONA
        initial_hot_day: 2024-07-05
        rationale: NWS_Phoenix_record_high_118F_day
      station_source:
        primary_for_probe: DOE_AFDC_NLR_nearest_stations_API_or_committed_snapshot
        current_domain: developer.nlr.gov
        note: developer.nrel.gov_retired_2026-05-29
      equipment_profile_registry:
        role: explicit_manufacturer_bound_derating_curves_only
        initial_profile: ABB_TERRA_184_HEAVY_DUTY_SCENARIO_PROFILE
        profile_binding_rule: >-
          The profile is a declared scenario/equipment input. Public station metadata does not establish the installed equipment model.
      thermal_mapper:
        role: map_each_site_to_a_real_FortyGuard_heat_cell_without_interpolation_claims
      capacity_engine:
        role: deterministic_expected_thermal_capacity_kw_from_temperature_and_declared_curve
      baseline_comparator:
        baselines:
          - NAMEPLATE_NO_TEMPERATURE
          - UNIFORM_AOI_TEMPERATURE_FOR_HYPERLOCAL_ISOLATION
          - EXTERNAL_GENERIC_WEATHER_FOR_FINAL_ATTRIBUTION_IF_AVAILABLE
      scheduler:
        role: constrained_assignment_of_energy_jobs_to_sites_or_time_windows
        initial_implementation: deterministic_not_LLM
      decision_delta_report:
        role: explain_exactly_what_changed_between_baseline_and_FortyGuard_and_why

    semantic_compatibility:
      status: STRONGLY_SUPPORTED_BUT_LIVE_RESPONSE_STILL_ATTESTED
      evidence: >-
        Official quickstart use-case documentation describes env_params temperature as ambient air temperature and feeds heatmap-derived
        peak_temp_c into that ambient-temperature argument. This supports comparison with an EVSE ambient-temperature derating curve.
      remaining_boundary: >-
        FortyGuard heatmap is not charger-internal or connector temperature; manufacturer documentation notes connector and EV-side
        conditions can impose additional limits.

    unit_and_schema_reconciliation:
      official_repo_conflict: true
      README_table: tcm_described_as_Celsius
      current_client_docstring: tcm_tile_readings_described_as_Fahrenheit
      current_use_case_design_spec: cached_hourly_geojson_explicitly_Fahrenheit_then_converted_to_Celsius
      handling: >-
        Preserve raw values and conversion provenance. Use Fahrenheit only when schema/live evidence matches the current client/spec
        contract or an explicit unit field attests it. Never infer the unit solely from numeric magnitude.
      live_diurnal_shape: UNRESOLVED
      note: >-
        Official use-case design documents a live single-hour call and cached 24-hour GeoJSON, so the probe does not assume one live call
        returns 24 hours. It supports hourly-key payloads if present but budgets bounded single-hour calls first.

    proof_ladder:
      P0_SCHEMA_DRY_RUN:
        billable_FortyGuard_calls: 0
        pass: probe_runs_on_labeled_synthetic_fixture_and_produces_provenance_and_delta_report
      P1_REAL_TCM_CAPABILITY_AND_UNIT_ATTESTATION:
        pass: real_response_schema_is_parsed_and_temperature_unit_is_attested_without_guessing
        hard_fail: temperature_unit_or_required_temperature_field_cannot_be_resolved
      P2_SPATIAL_DERATING_DIFFERENTIATION:
        method: same_declared_equipment_profile_across_sites
        primary_pass: at_least_two_sites_fall_into_different_documented_derating_bands
        secondary_pass: material_expected_capacity_spread_is_observed_and_reported_without_overclaiming
      P3_DURATION_CONTEXT_OPTIONAL:
        method: exceedance_or_persistence_above_declared_Celsius_threshold
        activation: only_if_it_changes_operational_interpretation_after_P2
      P4_SCHEDULER_DECISION_DELTA:
        method: run_a_predeclared_job_sensitivity_set_not_one_cherry_picked_job
        strong_pass: at_least_one_assignment_or_feasibility_result_changes_for_a_non_degenerate_reason_traceable_to_thermal_capacity
        weak_result: only_tie_break_order_changes
      P5_EXTERNAL_BASELINE_FOR_DEMO:
        activation: required_before_final_sponsor_causality_claim_in_submission_demo_if_feasible
        source_candidate: NWS_Phoenix
        purpose: compare_hyperlocal_FortyGuard_decision_to_a_real_single_location_weather_baseline

    initial_equipment_evidence:
      source: ABB_Terra_94_104_124_184_North_America_operation_installation_manual
      heavy_duty_rating_terra_184_kw: 150
      heavy_duty_curve:
        - {max_temp_c: 40, output_factor: 1.00}
        - {max_temp_c: 45, output_factor: 0.93}
        - {max_temp_c: 50, output_factor: 0.80}
        - {max_temp_c: 55, output_factor: 0.67}
      above_55C: OUT_OF_DOCUMENTED_RANGE_NO_CAPACITY_INFERENCE

    bounded_call_budget:
      initial_tcm_completed_calls_max: 3
      optional_persistence_or_exceedance_calls_max: 1

    architecture_cutline:
      include_now: [raw_evidence_capture, unit_and_schema_attestation, real_EV_site_coordinates, thermal_cell_mapping, explicit_derating_profile, baseline_comparator, deterministic_capacity_engine, bounded_scheduler_sensitivity]
      exclude_until_proven_material: [LLM_agent, satellite_segmentation, streetview_segmentation, environmental_parameters, network_scale_database, authentication, notifications, elaborate_UI]

    critical_falsifier: >-
      If bounded real FortyGuard evidence cannot establish a material local thermal-capacity distinction or defensible decision delta,
      stop Candidate A before deep build.

  i23_shadow:
    status: COMPLETE
    captured_after_stable: true
    core_architecture_recommendation: BOUNDED_DETERMINISTIC_THERMAL_DISPATCH_PIPELINE_WITH_KILL_PROBE_FIRST
    core_architecture_disagreement: false
    material_new_leverage_found: true
    new_leverage_move: DUAL_PROOF_MODE_HISTORICAL_CAUSALITY_PLUS_PROSPECTIVE_OPERATIONAL
    intended_outcome: MAXIMIZE_REAL_FORTYGUARD_HACKATHON_WIN_PROBABILITY
    outcome_leverage:
      recommendation: >-
        Keep the stable kill-probe architecture, but separate proof into two evidence classes: (1) a reproducible historical extreme-heat
        replay that can be frozen and re-run for causal comparison, and (2) a current/+12-hour operating run demonstrating that the same
        pipeline can make a forward operational decision. Do not make the prospective run a kill criterion because current weather may
        not cross a derating band.
      why_material: >-
        Historical replay alone can prove the mechanism but leaves an evaluator able to ask whether this is merely retrospective analytics.
        A bounded prospective mode directly answers product actionability while preserving the historical run as the reproducible evidence
        artifact. The two modes prove different things and should not be conflated.
      expected_upside: HIGH
      materiality: MEDIUM_TO_HIGH
      reversibility: HIGH
      information_gain: HIGH
      effort_cost: LOW_TO_MEDIUM_AFTER_CORE_PROBE
      delay_cost: LOW
      hard_gate_status: PASS_AFTER_HISTORICAL_CAUSALITY_PROBE
      falsifier: >-
        If the prospective API path materially expands scope, requires unsupported forecast semantics, or threatens submission readiness,
        keep it as a clearly labeled optional mode and protect the reproducible historical proof.
    effort_cutline:
      decision: CONTINUE_CORE_PROBE_FIRST
      rule: >-
        Do not spend effort on prospective/live UI until P1/P2 establish the thermal-capacity premise. Add prospective mode only after the
        core proof passes; it must not delay the build candidate.
    quality_distinction:
      evaluator_risk_identified: RETROSPECTIVE_ONLY_PRODUCT_PERCEPTION
      mitigation: DUAL_PROOF_MODE
      distinction_verdict: MATERIAL_PROOF_PATH_IMPROVEMENT_IF_ADOPTED

  comparison:
    stable_recommendation: BOUNDED_DETERMINISTIC_THERMAL_DISPATCH_PIPELINE_WITH_KILL_PROBE_FIRST
    i23_recommendation: SAME_CORE_PLUS_DUAL_HISTORICAL_AND_PROSPECTIVE_PROOF_MODES
    architecture_material_disagreement: false
    proof_path_material_disagreement: true
    material_disagreement: true
    preliminary_experiment_grade: STRICT_IMPROVEMENT_CANDIDATE
    why_not_final_yet: >-
      I23 identified a proof-path risk and leverage move not explicitly required by stable PBPD. It counts as a candidate strict improvement
      only if the human accepts it and it survives effort/readiness constraints; external hackathon outcome evidence remains pending.
    human_decision: PENDING_GATE_2_ARCHITECTURE_DECISION
    later_observed_outcome: PENDING
