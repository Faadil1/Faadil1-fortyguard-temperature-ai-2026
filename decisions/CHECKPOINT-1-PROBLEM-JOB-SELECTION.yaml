checkpoint:
  id: FORTYGUARD_CHECKPOINT_1_PROBLEM_JOB_SELECTION
  date_opened: 2026-08-23
  date_human_decision: 2026-08-24
  gate_0_status: FROZEN
  concept_locked: false

  decision_context:
    intended_outcome: MAXIMIZE_REAL_FORTYGUARD_HACKATHON_WIN_PROBABILITY
    finalists:
      - EV_CHARGING_NETWORK_THERMAL_CAPACITY_AND_DERATING_OPERATIONS
      - DISTRIBUTION_GRID_TRANSFORMER_THERMAL_HEADROOM_AND_ASSET_OPERATIONS

  stable_pbpd_0_5_0:
    captured_first: true
    recommendation: EV_CHARGING_NETWORK_THERMAL_CAPACITY_AND_DERATING_OPERATIONS
    runner_up: DISTRIBUTION_GRID_TRANSFORMER_THERMAL_HEADROOM_AND_ASSET_OPERATIONS
    sponsor_causality_test: PASS_STRONG_IF_LOCAL_DIFFERENTIATION_CHANGES_ALLOCATION
    primary_user: CHARGE_POINT_OR_FLEET_CHARGING_OPERATIONS_MANAGER
    actual_decision: >-
      Before and during a high-heat window, decide which sites receive charging demand, which nominal charger capacities must be treated
      as thermally constrained, and which sites require intervention or operational avoidance.
    why:
      - manufacturer evidence provides explicit ambient-temperature derating behavior
      - DOE/NREL AFDC provides current U.S. charging-station and EV charging-unit data, including power_kW and port counts
      - FortyGuard spatial temperature plus exceedance/persistence can change actual capacity/allocation decisions
      - 60-90 second proof can show nameplate versus modeled thermal capacity and a changed operational action
      - substantially lower proof/data risk than transformer operations inside the hackathon deadline
    proof_boundary:
      allowed_claim: EXPECTED_THERMAL_DERATING_OR_HEADROOM_UNDER_STATED_EQUIPMENT_CURVE
      blocked_claims:
        - observed_real_charger_power_without_telemetry
        - charger_failure_prediction_without_measured_failure_data
        - temperature_is_the_only_driver_of_delivered_power
    falsifier: >-
      If real FortyGuard calls show negligible spatial/persistence differences among useful candidate sites, or generic city weather
      produces effectively the same ordering/action, sponsor causality fails and the direction must be reconsidered.

  i23_shadow:
    captured_after_stable: true
    status: COMPLETE
    recommendation: EV_CHARGING_NETWORK_THERMAL_CAPACITY_AND_DERATING_OPERATIONS
    runner_up: DISTRIBUTION_GRID_TRANSFORMER_THERMAL_HEADROOM_AND_ASSET_OPERATIONS
    material_new_leverage_found: false
    useful_emphasis: BOUNDED_API_AND_DATA_PROOF_BEFORE_DEEP_BUILD
    why_no_strict_improvement: >-
      I23 made the empirical proof gate more explicit, but stable PBPD had already selected the same family and recorded the same
      sponsor-causality falsifier. Same decision with more structured explanation is a tie.

  comparison:
    stable_recommendation: EV_CHARGING_NETWORK_THERMAL_CAPACITY_AND_DERATING_OPERATIONS
    i23_recommendation: EV_CHARGING_NETWORK_THERMAL_CAPACITY_AND_DERATING_OPERATIONS
    material_disagreement: false
    experiment_grade: TIE

  human_decision:
    decision: GO_EV_CHARGING_NETWORK_THERMAL_CAPACITY_AND_DERATING_OPERATIONS
    authority: EXPLICIT_USER_GO
    status: LOCKED_PROBLEM_JOB
    why: >-
      User approved proceeding after the stable/I23 recommendations were presented. Approval locks the problem/job, not a product concept.
    condition_preserved: >-
      The first bounded FortyGuard causality probe remains allowed to kill/pivot the direction if local thermal intelligence does not
      materially change an operational decision versus a generic weather baseline.

  later_observed_outcome: PENDING
